worker_processes auto;

events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx/ors
        levels=1:2
        keys_zone=ors_cache:20m
        max_size=500m
        inactive=10m
        use_temp_path=off;

    server {
        listen 80;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass https://api.openrouteservice.org;
            proxy_ssl_server_name on;
            proxy_set_header Host api.openrouteservice.org;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $content_type;
            proxy_request_buffering on;

            proxy_cache ors_cache;
            proxy_cache_methods GET HEAD POST;
            proxy_cache_key "$request_method|$uri|$args|$http_authorization|$request_body";
            proxy_cache_valid 200 10m;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;

            add_header X-ORS-Cache $upstream_cache_status always;
        }
    }
}
