name: Deploy Tourding

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tourding-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/tourding' }}
      APP_CONTAINER_IP: ${{ vars.APP_CONTAINER_IP || '10.10.130.10' }}
      DOCKER_NETWORK_SUBNET: ${{ vars.DOCKER_NETWORK_SUBNET || '10.10.130.0/24' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -eu
          if [ -z "${DOCKER_IMAGE:-}" ]; then
            echo "DOCKER_IMAGE is empty. Set production environment variable DOCKER_IMAGE, for example ghcr.io/giljjang/tourding" >&2
            exit 1
          fi
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "DEPLOY_PATH is empty. Set production environment variable DEPLOY_PATH, for example /home/tourding" >&2
            exit 1
          fi
          if [ -z "${APP_CONTAINER_IP:-}" ]; then
            echo "APP_CONTAINER_IP is empty. Set production environment variable APP_CONTAINER_IP, for example 10.10.130.10" >&2
            exit 1
          fi
          if [ -z "${DOCKER_NETWORK_SUBNET:-}" ]; then
            echo "DOCKER_NETWORK_SUBNET is empty. Set production environment variable DOCKER_NETWORK_SUBNET, for example 10.10.130.0/24" >&2
            exit 1
          fi

      - name: Validate required secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -eu
          for name in SERVER_HOST SERVER_USER SERVER_PASSWORD SUDO_PASSWORD GHCR_USERNAME GHCR_TOKEN ENV_FILE; do
            if [ -z "$(printenv "$name")" ]; then
              echo "$name is empty or missing. Check repository/environment secrets." >&2
              exit 1
            fi
          done

      - name: Compute image tag
        id: image
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare deployment bundle
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -eu
          mkdir -p .deploy
          printf '%s\n' "$ENV_FILE" > .deploy/runtime.env
          cp docker-compose.prod.yml .deploy/docker-compose.prod.yml

      - name: Create remote deployment directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -eu
            mkdir -p "${{ env.DEPLOY_PATH }}/incoming"

      - name: Upload deployment bundle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: ".deploy/*"
          target: "${{ env.DEPLOY_PATH }}/incoming"
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          APP_CONTAINER_IP: ${{ env.APP_CONTAINER_IP }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          DOCKER_NETWORK_SUBNET: ${{ env.DOCKER_NETWORK_SUBNET }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: APP_CONTAINER_IP,DEPLOY_PATH,DOCKER_IMAGE,DOCKER_NETWORK_SUBNET,GHCR_TOKEN,GHCR_USERNAME,IMAGE_TAG,SUDO_PASSWORD
          script: |
            set -eu

            sudo_exec() {
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S "$@"
            }

            DEPLOY_PATH="${DEPLOY_PATH%/}"
            INCOMING_PATH="$DEPLOY_PATH/incoming"
            COMPOSE_FILE="$DEPLOY_PATH/docker-compose.prod.yml"
            RUNTIME_ENV="$(mktemp /tmp/tourding-env.XXXXXX)"
            trap 'sudo_exec docker logout ghcr.io >/dev/null 2>&1 || true; rm -f "$RUNTIME_ENV"' EXIT

            mv "$INCOMING_PATH/runtime.env" "$RUNTIME_ENV"
            chmod 600 "$RUNTIME_ENV"
            mv "$INCOMING_PATH/docker-compose.prod.yml" "$COMPOSE_FILE"

            if sudo_exec docker compose version >/dev/null 2>&1; then
              COMPOSE_BIN="docker compose"
            elif sudo_exec docker-compose version >/dev/null 2>&1; then
              COMPOSE_BIN="docker-compose"
            else
              echo "docker compose command not found on server" >&2
              exit 1
            fi

            sudo_exec docker login ghcr.io -u "$GHCR_USERNAME" -p "$GHCR_TOKEN"

            if [ "$COMPOSE_BIN" = "docker compose" ]; then
              sudo_exec env DOCKER_IMAGE="$DOCKER_IMAGE" IMAGE_TAG="$IMAGE_TAG" APP_CONTAINER_IP="$APP_CONTAINER_IP" DOCKER_NETWORK_SUBNET="$DOCKER_NETWORK_SUBNET" \
                docker compose --env-file "$RUNTIME_ENV" -f "$COMPOSE_FILE" pull
              sudo_exec env DOCKER_IMAGE="$DOCKER_IMAGE" IMAGE_TAG="$IMAGE_TAG" APP_CONTAINER_IP="$APP_CONTAINER_IP" DOCKER_NETWORK_SUBNET="$DOCKER_NETWORK_SUBNET" \
                docker compose --env-file "$RUNTIME_ENV" -f "$COMPOSE_FILE" up -d --remove-orphans
              sudo_exec env DOCKER_IMAGE="$DOCKER_IMAGE" IMAGE_TAG="$IMAGE_TAG" APP_CONTAINER_IP="$APP_CONTAINER_IP" DOCKER_NETWORK_SUBNET="$DOCKER_NETWORK_SUBNET" \
                docker compose --env-file "$RUNTIME_ENV" -f "$COMPOSE_FILE" ps
              sudo_exec env DOCKER_IMAGE="$DOCKER_IMAGE" IMAGE_TAG="$IMAGE_TAG" APP_CONTAINER_IP="$APP_CONTAINER_IP" DOCKER_NETWORK_SUBNET="$DOCKER_NETWORK_SUBNET" \
                docker compose --env-file "$RUNTIME_ENV" -f "$COMPOSE_FILE" logs --no-color --tail=50 app
            else
              sudo_exec env DOCKER_IMAGE="$DOCKER_IMAGE" IMAGE_TAG="$IMAGE_TAG" APP_CONTAINER_IP="$APP_CONTAINER_IP" DOCKER_NETWORK_SUBNET="$DOCKER_NETWORK_SUBNET" \
                docker-compose --env-file "$RUNTIME_ENV" -f "$COMPOSE_FILE" pull
              sudo_exec env DOCKER_IMAGE="$DOCKER_IMAGE" IMAGE_TAG="$IMAGE_TAG" APP_CONTAINER_IP="$APP_CONTAINER_IP" DOCKER_NETWORK_SUBNET="$DOCKER_NETWORK_SUBNET" \
                docker-compose --env-file "$RUNTIME_ENV" -f "$COMPOSE_FILE" up -d --remove-orphans
              sudo_exec env DOCKER_IMAGE="$DOCKER_IMAGE" IMAGE_TAG="$IMAGE_TAG" APP_CONTAINER_IP="$APP_CONTAINER_IP" DOCKER_NETWORK_SUBNET="$DOCKER_NETWORK_SUBNET" \
                docker-compose --env-file "$RUNTIME_ENV" -f "$COMPOSE_FILE" ps
              sudo_exec env DOCKER_IMAGE="$DOCKER_IMAGE" IMAGE_TAG="$IMAGE_TAG" APP_CONTAINER_IP="$APP_CONTAINER_IP" DOCKER_NETWORK_SUBNET="$DOCKER_NETWORK_SUBNET" \
                docker-compose --env-file "$RUNTIME_ENV" -f "$COMPOSE_FILE" logs --tail=50 app
            fi

            CONTAINER_STATUS="$(sudo_exec docker inspect -f '{{.State.Status}}' tourding-prod-app 2>/dev/null || true)"
            if [ "$CONTAINER_STATUS" != "running" ]; then
              echo "tourding-prod-app is not running after deploy" >&2
              exit 1
            fi

            rm -rf "$INCOMING_PATH"
