services:
  mysql:
    image: mysql:8.0
    container_name: tourding-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: tourding_db
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  app:
    build: .
    container_name: tourding-app
    depends_on:
      - mysql
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_APPLICATION_NAME=tourding
      - SPRING_DATASOURCE_URL=${MYSQL_URL}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${MYSQL_DRIVER}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=false
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=${MYSQL_DIALECT}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - TOUR_CLIENT_SERVICEKEY=${TOUR_CLIENT_SERVICEKEY}
      - SWAGGER_SERVER_URL=${SWAGGER_SERVER_URL}
      - KAKAO_CLIENT_KAKAOAK=${KAKAO_CLIENT_KAKAOAK}
      - OPEN_ROUTE_SERVICE_KEY=${OPEN_ROUTE_SERVICE_KEY}
      - OPEN_AI_SECRET_KEY=${OPEN_AI_SECRET_KEY}
      - OPENAI_STT_MODEL=${OPENAI_STT_MODEL:-gpt-4o-mini-transcribe}
      - OPENAI_INTENT_MODEL=${OPENAI_INTENT_MODEL:-gpt-5-mini}
      - AI_INTENT_RULE_FIRST=${AI_INTENT_RULE_FIRST:-true}
      - AI_AUDIO_MAX_SECONDS=${AI_AUDIO_MAX_SECONDS:-8}
      - AI_REQUEST_TIMEOUT_MS=${AI_REQUEST_TIMEOUT_MS:-15000}
      - AI_CANDIDATE_COUNT=${AI_CANDIDATE_COUNT:-3}
      - OPEN_WEATHER_MAP_KEY=${OPEN_WEATHER_MAP_KEY}
      - APPLE_KEY_ID=${APPLE_KEY_ID}
      - APPLE_ISS=${APPLE_ISS}
      - APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY}
    restart: unless-stopped
volumes:
  mysql_data:
